name: Polya checks and Android build
on:
  push:
    branches: ['codex/polya-input-phagi-release']
  pull_request:
    paths: ['notes/**', 'supabase/functions/phagi-notes/**', '.github/workflows/polya-check.yml']
  workflow_dispatch:
concurrency:
  group: polya-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test tools outside the application
        run: |
          mkdir -p "$RUNNER_TEMP/polya-test"
          cd "$RUNNER_TEMP/polya-test"
          npm init -y
          npm install linkedom@0.18.15 playwright@1.56.1 pdfjs-dist@6.5.438
          npx playwright install --with-deps chromium
      - name: Syntax and input regression tests
        env:
          NODE_PATH: ${{ runner.temp }}/polya-test/node_modules
        run: |
          for file in notes/js/*.js; do node --check "$file"; done
          node --test notes/tests/input.test.mjs notes/tests/phagi.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.5.6'
      - name: Phagi authentication and submission tests
        run: deno test --allow-env supabase/functions/phagi-notes/index.test.ts
      - name: Browser and PDF integration tests
        env:
          NODE_PATH: ${{ runner.temp }}/polya-test/node_modules
          POLYA_PDFJS_ROOT: ${{ runner.temp }}/polya-test/node_modules/pdfjs-dist
        run: node notes/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polya-validation
          path: |
            /tmp/polya-*.png
            /tmp/polya-*.pdf
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android release APK
        run: gradle -p notes/android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Polya-0.8.0-unsigned
          path: notes/android/app/build/outputs/apk/release/app-release-unsigned.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS application
        run: bash notes/scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Polya-0.8.0-macOS
          path: notes/dist/Polya-macOS.zip
