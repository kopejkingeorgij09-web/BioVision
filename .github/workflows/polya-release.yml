name: Polya Android release package
on:
  push:
    branches: ['codex/polya-073-apk-release']
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build unsigned release and gather verification tools
        run: |
          gradle -p notes/android assembleRelease --no-daemon
          mkdir -p release-package
          cp notes/android/app/build/outputs/apk/release/app-release-unsigned.apk release-package/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-package/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" release-package/
      - uses: actions/upload-artifact@v4
        with:
          name: Polya-0.7.3-release-unsigned
          path: release-package/
