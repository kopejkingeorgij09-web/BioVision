name: Zov Lesa Android
on:
  push:
    branches: ['codex/zov-study-notebook']
  pull_request:
    paths: ['bamboo/**', '.github/workflows/zov-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zov-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check web sources
        run: |
          for file in bamboo/js/*.js bamboo/android/web/*.js; do node --check "$file"; done
          node --test bamboo/tests/*.test.cjs
      - name: Build APK
        run: |
          gradle -p bamboo/android assembleRelease lintRelease assembleDebug assembleDebugAndroidTest --no-daemon
          mkdir -p /tmp/zov-release
          cp bamboo/android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/zov-release/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/zov-release/
      - uses: actions/upload-artifact@v4
        with:
          name: Zov-Lesa-1.6.0-unsigned
          path: /tmp/zov-release/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell input keyevent 82
            adb install bamboo/android/app/build/outputs/apk/debug/app-debug.apk
            adb install bamboo/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant org.biovision.zovlesa android.permission.POST_NOTIFICATIONS
            adb shell appops set org.biovision.zovlesa SCHEDULE_EXACT_ALARM allow
            adb shell am instrument -w org.biovision.zovlesa.test/org.biovision.zovlesa.NativeChecks | tee /tmp/native-result.txt
            adb logcat -d -s chromium AndroidRuntime | tail -100
            adb pull /sdcard/Android/data/org.biovision.zovlesa/files /tmp/widget-previews || true
            grep -q 'PASS: WebView bridge' /tmp/native-result.txt
            python3 bamboo/tools/check-apk-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zov-Lesa-widget-previews
          path: /tmp/widget-previews/
          if-no-files-found: ignore
