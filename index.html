<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Микробиология · БиоВиз</title>
<meta name="description" content="БиоВиз: конспекты лекций по микробиологии с интерактивными рисунками, лаборатория моделей и помощник для научной группы.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F6F2">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;background:#F5F6F2}
:root[data-theme="dark"]{color-scheme:dark;background:#101614}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;background:#101614}}
body{margin:0;min-height:100vh;font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:inherit}
#bvhost{display:block;min-height:100vh}
.boot{display:flex;align-items:center;gap:12px;padding:40px 24px;color:#5E6B65;font-size:15px}
:root[data-theme="dark"] .boot{color:#97A69F}
.boot i{width:22px;height:22px;border-radius:50%;border:3px solid #DFE4DE;border-top-color:#0F5D4A;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
.boot button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:#0F5D4A;color:#fff;font-weight:600}
</style>
<script>
/* тема до загрузки, чтобы страница не мигала белым */
try{const t=JSON.parse(localStorage.getItem('bv2:theme')||'"auto"');const d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script src="bioviz/x/cloud.js"></script>
</head>
<body>
<div id="bvhost"><div class="boot" id="boot"><i></i>Загружаю курс…</div></div>
<script>
/* Загрузка: файлы качаются параллельно, выполняются строго по порядку.
   К адресу добавляется версия: после обновления браузер не возьмёт старый файл из кеша.
   ПЕРЕД КАЖДЫМ PUSH поднимай BV_VER. */
const BV_VER='2026-10-30-larger';
const CORE=['bioviz/core/base.js','bioviz/core/konspekt.js','bioviz/core/vz.js','bioviz/core/lab.js','content/course.js'];
const TAIL=['bioviz/core/app.js','bioviz/core/ai.js'];
const url=(s,bust)=>s+'?v='+BV_VER+(bust?'&r='+Date.now():'');
function load(src,bust){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=url(src,bust);e.async=false;
  e.onload=ok;e.onerror=()=>{e.remove();no(new Error('Не загрузился '+src))};document.head.appendChild(e)})}
async function tryLoad(src){for(let i=0;i<3;i++){try{await load(src,i>0);return true}catch(e){console.warn(e.message);await new Promise(r=>setTimeout(r,600*(i+1)))}}return false}
function preload(list){list.forEach(s=>{const l=document.createElement('link');l.rel='preload';l.as='script';l.href=url(s);document.head.appendChild(l)})}
function fail(msg){const b=document.getElementById('boot');if(b){b.innerHTML=msg+' <button>Обновить</button>';b.querySelector('button').onclick=()=>location.reload()}}
(async()=>{
  preload(CORE.concat(TAIL));
  /* оболочка должна пережить загрузку: заглушку убираем, когда base.js создаст теневой корень */
  for(const s of CORE){if(!await tryLoad(s)){fail('Не получилось загрузить курс. Проверьте интернет.');return}}
  const C=window.BV_COURSE,files=C.lectures.concat(C.labs).map(x=>x.file),missed=[];
  preload(files);
  for(const s of files){if(!await tryLoad(s))missed.push(s)}
  for(const s of TAIL){if(!await tryLoad(s)){fail('Не получилось загрузить курс. Проверьте интернет.');return}}
  const b=document.getElementById('boot');if(b)b.remove();
  BV.start();
  if(missed.length)console.warn('Не загрузились:',missed);
})().catch(e=>{console.error(e);fail('Курс не запустился из-за ошибки. Обновите страницу.')});
</script>
</body>
</html>
