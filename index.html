<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лекции научной группы · БиоВиз</title>
<meta name="description" content="БиоВиз: конспекты лекций по микробиологии и биоинформатике с интерактивными рисунками и журнал лабораторных работ научной группы.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3EE">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;background:#F2F3EE}
:root[data-theme="dark"]{color-scheme:dark;background:#0D1410}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;background:#0D1410}}
body{margin:0;min-height:100vh;font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:inherit}
#bvhost{display:block;min-height:100vh}
.boot{display:flex;align-items:center;gap:12px;padding:40px 24px;color:#5B5F66;font-size:15px}
:root[data-theme="dark"] .boot{color:#9EA3A9}
.boot i{width:22px;height:22px;border-radius:50%;border:3px solid #D6DCD3;border-top-color:#1F5A3D;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
.boot button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:#1F5A3D;color:#fff;font-weight:600}
</style>
<script>
/* тема до загрузки, чтобы страница не мигала белым */
try{const t=JSON.parse(localStorage.getItem('bv2:theme')||'"auto"');const d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.background=d?'#0D1410':'#F2F3EE'}catch(e){}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</head>
<body>
<div class="boot" id="boot" role="status"><i></i>Загружаю курс…</div>
<div id="bvhost"></div>
<script>
/* Версия обязательна перед публикацией. Код раздела исполняется один раз за сеанс. */
const BV_VER='2026-11-14-polya-input-v1';
const CORE=['bioviz/x/cloud.js','bioviz/core/base.js','content/course.js','bioviz/core/app.js','bioviz/core/personal.js','bioviz/core/learning.js','bioviz/core/activity.js'];
const GROUPS={
 common:['bioviz/core/prompt.js','bioviz/core/search.js','bioviz/core/offline.js'],
 reading:['bioviz/core/offline.js','bioviz/core/prompt.js','bioviz/core/reading.js'],
 labs:['bioviz/core/prompt.js','bioviz/core/labworks.js'],
 admin:['bioviz/core/labworks.js','bioviz/core/admin.js'],
 lecture:['bioviz/core/konspekt.js','bioviz/core/mol.js','bioviz/core/vz.js','bioviz/core/split.js','bioviz/core/lnav.js','bioviz/core/terms.js','bioviz/core/prompt.js']
};
const TAIL=[...new Set(Object.values(GROUPS).flat())];
const loaded=new Map(),hints=new Set();
const url=s=>s+'?v='+BV_VER;
function preload(list){for(const src of list){if(hints.has(src))continue;hints.add(src);const l=document.createElement('link');l.rel='preload';l.as='script';l.href=url(src);document.head.appendChild(l)}}
function one(src){if(loaded.has(src))return loaded.get(src);
 const task=(async()=>{for(let i=0;i<3;i++){try{await new Promise((ok,no)=>{const e=document.createElement('script');e.src=url(src)+(i?'&r='+Date.now():'');e.async=false;e.onload=ok;e.onerror=()=>{e.remove();no(Error('Не загрузился '+src))};document.head.appendChild(e)});return}catch(e){if(i===2)throw e;await new Promise(r=>setTimeout(r,250*(i+1)))}}})();
 loaded.set(src,task);task.catch(()=>loaded.delete(src));return task
}
async function files(list){preload(list);for(const src of list)await one(src)}
window.BV_LOAD={files,ensure:name=>files(GROUPS[name]||[]),
 async lecture(L){await files(GROUPS.lecture);await one(L.file)},
 async allLectures(){await files(GROUPS.lecture);await Promise.all(BV_COURSE.lectures.map(L=>one(L.file)))},
 async route(hash){const p=String(hash).replace(/^#\/?/,'').split('/');if(p[0]==='reading')await files(GROUPS.reading);else if(p[0]==='labs'||p[0]==='lab'||p[0]==='microlab')await files(GROUPS.labs);else if(p[0]==='l'||p[0]==='bact'){const L=BV_COURSE.lectures.find(L=>String(L.n)===(p[0]==='bact'?'1':p[1]));if(L)await this.lecture(L)}}};
function fail(msg){const b=document.getElementById('boot');if(b){b.innerHTML=msg+' <button>Обновить</button>';b.querySelector('button').onclick=()=>location.reload()}}
(async()=>{await files(CORE);document.getElementById('boot')?.remove();
 const ready=BV.start();BV_LOAD.ensure('common').catch(e=>console.warn('Дополнительные функции:',e.message));await ready;
})().catch(e=>{console.error(e);fail('Курс не запустился. Проверь соединение и обнови страницу.')});

</script>
</body>
</html>
