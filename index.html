<div class="wrap"><div id="bvhost"></div></div>
<div class="ck" id="ck" role="dialog" aria-modal="false" aria-labelledby="ckT" aria-describedby="ckD" hidden>
  <div class="ck-h"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5a19 19 0 1 0 19 19 6 6 0 0 1-7-6.5A6 6 0 0 1 28.5 11 6 6 0 0 1 24 5z" fill="color-mix(in srgb,var(--chem) 28%,var(--card))" stroke="var(--chem)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="17" cy="20" r="2.4" fill="var(--chem)"/><circle cx="25" cy="31" r="2.4" fill="var(--chem)"/><circle cx="15.5" cy="30" r="1.5" fill="var(--chem)"/><circle cx="32" cy="26" r="1.5" fill="var(--chem)"/></svg>
   <div><h2 id="ckT">БиоВиз использует cookie</h2><p id="ckD">Нужны, чтобы помнить ваш прогресс и узнавать вас при следующем визите: так ошибки, статистика и карточки не теряются, а учитель видит ваш прогресс в журнале. Выберите, что разрешить.</p></div></div>
  <div class="ck-opts" id="ckOpts" hidden>
   <label class="ck-o"><input type="checkbox" checked disabled><span><b>Необходимые</b><span>Ваш выбор по cookie, ответы, ошибки и карточки. Без них тренажёр не работает. Всегда включены.</span></span></label>
   <label class="ck-o"><input type="checkbox" id="ckF"><span><b>Функциональные</b><span>Запоминают тему оформления и последний открытый раздел.</span></span></label>
   <label class="ck-o"><input type="checkbox" id="ckA"><span><b>Идентификация и статистика</b><span>Постоянный ID посетителя, число визитов, даты первого и последнего входа, тип устройства. Если вы вошли по коду ученика, эти данные сохраняются в вашем профиле и видны учителю в журнале.</span></span></label>
  </div>
  <div class="ck-b"><button type="button" id="ckSet">Настроить</button><button type="button" id="ckMin">Только необходимые</button><button type="button" class="pri" id="ckAll">Принять все</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
/* ---------- cookie: согласие, ID посетителя, визиты ---------- */
(function(){
  const YEAR=365*864e5,VER=1;
  const cGet=n=>{try{const m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):null}catch(e){return null}};
  const cSet=(n,v,ms)=>{try{document.cookie=n+'='+encodeURIComponent(v)+'; path=/; max-age='+Math.round(ms/1000)+'; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'')}catch(e){}};
  const cDel=n=>{try{document.cookie=n+'=; path=/; max-age=0; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'')}catch(e){}};
  const lGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const lSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
  // значение храним и в cookie, и в localStorage: если браузер не отдаёт cookie странице, выбор всё равно не потеряется
  const get=k=>cGet(k)??lGet(k);
  const put=(k,v)=>{if(v==null){cDel(k);lSet(k,null)}else{cSet(k,v,YEAR);lSet(k,v)}};
  let consent=null;try{const c=JSON.parse(get('bv_consent')||'null');if(c&&c.v===VER)consent=c}catch(e){}
  const subs=[];let visitor=null;
  const rid=()=>{try{return crypto.randomUUID()}catch(e){return 'v-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}};
  const device=()=>{const u=navigator.userAgent||'';const os=/iPhone|iPad|iPod/.test(u)?'iOS':/Android/.test(u)?'Android':/Mac OS X/.test(u)?'macOS':/Windows/.test(u)?'Windows':/Linux/.test(u)?'Linux':'другое';
    const br=/YaBrowser/.test(u)?'Яндекс Браузер':/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Firefox\//.test(u)?'Firefox':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':'браузер';
    const t=/Mobi|iPhone|Android(?!.*Tablet)/.test(u)?'телефон':/iPad|Tablet/.test(u)?'планшет':'компьютер';return t+' · '+os+' · '+br};
  function track(){
    if(!consent||!consent.a){visitor=null;return}
    let id=get('bv_vid');if(!id){id=rid()}put('bv_vid',id);
    const now=Date.now(),first=+get('bv_first')||now,last=+get('bv_last')||0;let visits=+get('bv_visits')||0;
    // новый визит — если с прошлой активности прошло больше 30 минут
    let ss=null;try{ss=sessionStorage.getItem('bv_sess')}catch(e){}
    if(!ss||now-last>30*6e4){visits++;try{sessionStorage.setItem('bv_sess','1')}catch(e){}}
    put('bv_first',String(first));put('bv_last',String(now));put('bv_visits',String(visits));
    visitor={id,first,last:now,prev:last||null,visits,device:device()}}
  function wipe(){['bv_vid','bv_first','bv_last','bv_visits'].forEach(k=>put(k,null));visitor=null}
  function save(f,a){const was=consent;consent={v:VER,n:1,f:f?1:0,a:a?1:0,t:Date.now()};put('bv_consent',JSON.stringify(consent));
    if(!a)wipe();if(!f){lSet('theme:last',null)}track();hide();subs.forEach(fn=>{try{fn(consent,visitor,was)}catch(e){}})}
  const ck=$('#ck'),opts=$('#ckOpts');
  function show(detail){$('#ckF').checked=consent?!!consent.f:true;$('#ckA').checked=consent?!!consent.a:true;
    opts.hidden=!detail;$('#ckSet').textContent=detail?'Сохранить выбор':'Настроить';ck.hidden=false;
    setTimeout(()=>(detail?$('#ckF'):$('#ckAll')).focus({preventScroll:true}),0)}
  function hide(){ck.hidden=true}
  $('#ckAll').addEventListener('click',()=>save(1,1));
  $('#ckMin').addEventListener('click',()=>save(0,0));
  $('#ckSet').addEventListener('click',()=>{if(opts.hidden)show(true);else save($('#ckF').checked,$('#ckA').checked)});
  $('#ckbtn').addEventListener('click',()=>ck.hidden?show(true):hide());
  ck.addEventListener('keydown',e=>{if(e.key==='Escape'&&consent){e.preventDefault();hide()}});
  track();
  window.BV_CONSENT={
    get:()=>consent,allows:k=>k==='n'?true:!!(consent&&consent[k]),visitor:()=>visitor,
    open:()=>show(true),forget:()=>{wipe();if(consent&&consent.a){consent.a=0;put('bv_consent',JSON.stringify(consent));subs.forEach(fn=>{try{fn(consent,null)}catch(e){}})}},
    on:fn=>{subs.push(fn)}};
  if(!consent)setTimeout(()=>show(false),600);
})();

/* ---------- темы: те же, что на платформе; выбор запоминается в этом браузере ---------- */
const THEMES=[
  {id:'',n:'Как в системе',d:'Светлая днём, тёмная, если так настроено устройство',sw:['#F1F6F2','#0C1512','#2F8A3B','#7FD6A8'],half:1},
  {id:'light',n:'Светлая',d:'Агар и зелень',eff:'light',sw:['#F1F6F2','#0E4A38','#C2366B']},
  {id:'dark',n:'Тёмная',d:'Для вечера',eff:'dark',sw:['#0C1512','#7FD6A8','#FF77A6']},
  {id:'chloro',n:'Хлорофилл',d:'Клетки листа с хлоропластами',eff:'light',sw:['#EDF4E0','#2F5D11','#C2541E'],bio:1},
  {id:'reef',n:'Коралловый риф',d:'Морская вода, диатомеи и кораллы',eff:'light',sw:['#E9F5F6','#0B5068','#E8573A'],bio:1},
  {id:'gram',n:'Окраска по Граму',d:'Кристаллический фиолетовый и сафранин',eff:'light',sw:['#F5F1FA','#4A2384','#D0386F'],bio:1},
  {id:'lumi',n:'Биолюминесценция',d:'Светящийся планктон в ночном море',eff:'dark',sw:['#060C18','#4FEBCB','#8C95FF'],bio:1},
  {id:'amber',n:'Янтарь',d:'Смола, в которой застыла древняя жизнь',eff:'dark',sw:['#1A1209','#F2B53D','#FF8A5B'],bio:1}];
const thById=v=>THEMES.find(t=>t.id&&t.id===v);
const thSys=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const thGet=k=>{try{const v=localStorage.getItem(k);return thById(v)?v:null}catch(e){return null}};
const thPut=(k,v)=>{try{if(v&&window.BV_CONSENT&&!BV_CONSENT.allows('f'))return;v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
function thApply(v){
  const r=document.documentElement,t=thById(v);t?r.setAttribute('data-theme',v):r.removeAttribute('data-theme');
  const eff=t?t.eff:thSys();r.setAttribute('data-eff',eff);
  const h=$('#bvhost');if(h)h.setAttribute('data-theme',eff);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||m.content;
  const b=$('#thbtn');if(b){const l='Тема оформления: '+(t?t.n:'как в системе');b.setAttribute('aria-label',l);b.title=l}
  thMark()}
function thSwatch(t){const s=t.sw;return `<span class="sw" style="background:${t.half?`linear-gradient(135deg,${s[0]} 50%,${s[1]} 50%)`:s[0]}"><i style="background:${t.half?s[2]:s[1]}"></i><i style="background:${t.half?s[3]:s[2]}"></i></span>`}
function thMenu(){
  let m=$('#thmenu');if(m)return m;
  m=document.createElement('div');m.id='thmenu';m.className='thmenu';m.setAttribute('role','menu');m.setAttribute('aria-label','Тема оформления');m.hidden=true;
  const opt=t=>`<button type="button" class="thopt" role="menuitemradio" aria-checked="false" data-th="${t.id}">${thSwatch(t)}<span class="tx"><b>${t.n}</b><small>${t.d}</small></span><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`;
  m.innerHTML=`<div class="thh">Оформление</div>${THEMES.filter(t=>!t.bio).map(opt).join('')}<hr><div class="thh">Биологические темы</div>${THEMES.filter(t=>t.bio).map(opt).join('')}`;
  m.addEventListener('click',e=>{const o=e.target.closest('.thopt');if(!o)return;const v=o.dataset.th||null;thApply(v);thPut('theme:last',v)});
  m.addEventListener('keydown',e=>{const os=[...m.querySelectorAll('.thopt')],i=os.indexOf(document.activeElement);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();os[(i+(e.key==='ArrowDown'?1:os.length-1))%os.length].focus()}
    else if(e.key==='Escape'){e.preventDefault();thClose(true)}else if(e.key==='Tab')thClose(false)});
  document.body.appendChild(m);thMark();return m}
function thMark(){const m=$('#thmenu');if(!m)return;const v=document.documentElement.getAttribute('data-theme')||'';m.querySelectorAll('.thopt').forEach(o=>o.setAttribute('aria-checked',String(o.dataset.th===v)))}
function thPlace(){const m=$('#thmenu'),b=$('#thbtn');if(!m||m.hidden||!b)return;const r=b.getBoundingClientRect();
  m.style.top=Math.round(r.bottom+8)+'px';m.style.left=Math.round(Math.max(8,Math.min(innerWidth-m.offsetWidth-8,r.right-m.offsetWidth)))+'px'}
function thOpen(){const m=thMenu();m.hidden=false;$('#thbtn').setAttribute('aria-expanded','true');thPlace();(m.querySelector('.thopt[aria-checked="true"]')||m.querySelector('.thopt')).focus({preventScroll:true})}
function thClose(focus){const m=$('#thmenu');if(!m||m.hidden)return;m.hidden=true;$('#thbtn').setAttribute('aria-expanded','false');if(focus)$('#thbtn').focus()}
document.addEventListener('pointerdown',e=>{const m=$('#thmenu');if(m&&!m.hidden&&!m.contains(e.target)&&!e.target.closest('#thbtn'))thClose(false)},true);
addEventListener('resize',thPlace);addEventListener('scroll',thPlace,{passive:true});
// если оформление уже задано снаружи (светлая или тёмная тема просмотрщика), а своего выбора ещё нет, берём его
{const pre=document.documentElement.getAttribute('data-theme');thApply(thGet('theme:last')||(thById(pre)?pre:null))}
new MutationObserver(()=>{const r=document.documentElement,t=thById(r.getAttribute('data-theme')),eff=t?t.eff:thSys();
  if(r.getAttribute('data-eff')!==eff){r.setAttribute('data-eff',eff);const h=$('#bvhost');if(h)h.setAttribute('data-theme',eff)}thMark()})
  .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.hasAttribute('data-theme'))thApply(null)});
$('#thbtn').addEventListener('click',()=>{const m=$('#thmenu');m&&!m.hidden?thClose(false):thOpen()});

/* ---------- Биовиз: разметка и стили в теневом DOM #bvhost, код в bioviz/bv.js, дополнения в bioviz/*.js ---------- */
function bvFull(on,win){
  const h=$('#bvhost');const was=document.body.classList.contains('bvfull');
  document.body.classList.toggle('bvfull',on);h.classList.toggle('full',on);
  try{if(on&&!was&&!win&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
    else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
  if(on!==was)window.scrollTo(0,0)}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('bvfull'))bvFull(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('bvfull')&&!document.fullscreenElement&&!document.querySelector('dialog[open]'))bvFull(false)});
/* Надёжная загрузка: все файлы качаются параллельно (preload), выполняются строго по порядку.
   К адресу добавляется версия, чтобы после обновления браузер не взял старый файл из кеша.
   Упавший файл перезапрашивается; недогруженное дополнение не мешает запуску остальных. */
const BV_VER='2026-10-26-gh1';
const bvUrl=(src,r)=>src+'?v='+BV_VER+(r?'&r='+Date.now():'');
/* попытка 1: с версией; 2: без параметров (если хостинг не понимает ?v=); 3+: с меткой против кеша */
function bvScript(src,i){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=i===1?src:bvUrl(src,i>1);e.async=false;
  e.onload=()=>ok();e.onerror=()=>{e.remove();no(new Error('Не загрузился '+src))};document.head.appendChild(e)})}
async function bvTry(src,tries){for(let i=0;i<tries;i++){try{await bvScript(src,i);return true}catch(e){console.warn(e.message);if(i<tries-1)await new Promise(r=>setTimeout(r,700*(i+1)))}}return false}
function bvPreload(list){list.forEach(s=>{try{const l=document.createElement('link');l.rel='preload';l.as='script';l.href=bvUrl(s);document.head.appendChild(l)}catch(e){}})}
// дополнения: старые разделы БиоВиза (главная, конспекты, карточки, профиль) и вузовские конспекты
const BV_EXTRA=['glossary','vuz-cards','hub','ref','srs','me'].map(n=>'bioviz/x/'+n+'.js').concat(["bioviz/x/vuz-core.js", "bioviz/x/vuz-chem.js", "bioviz/x/vuz-tour.js", "bioviz/x/vuz-cell.js", "bioviz/x/vuz-energy.js", "bioviz/x/vuz-osmos.js", "bioviz/x/vuz-micro.js", "bioviz/x/deep-core.js", "bioviz/x/deep-tour.js", "bioviz/x/deep-cell1.js", "bioviz/x/deep-cell2.js", "bioviz/x/cell-new.js", "bioviz/x/cell-tasks.js", "bioviz/x/bact-virus.js", "bioviz/x/cyc-mit.js", "bioviz/x/cyc-mei.js", "bioviz/x/cyc-gam.js", "bioviz/x/elite.js","bioviz/x/microlab.js","bioviz/x/bioinf.js","bioviz/x/qs-refs.js","bioviz/x/qs.js","bioviz/x/qs2.js","bioviz/x/ask.js","bioviz/x/reader.js","bioviz/x/link.js","bioviz/x/ux.js","bioviz/x/progress.js"]);
// настоящая цель события, даже если оно пришло из теневого DOM
window.BV_ET=e=>(e&&e.composedPath&&e.composedPath()[0])||e.target;
// разделы, у которых есть вкладка «Конспект с визуализациями» (кроме трёх исходных)
window.BV_KDOCS={"mitosis": ["Визуализации", "Конспект с визуализациями"], "meiosis": ["Визуализации", "Конспект с визуализациями"], "cycles": ["Визуализации", "Конспект с визуализациями"], "energy": ["Визуализации", "Конспект с визуализациями"], "osmos": ["Визуализации", "Конспект с визуализациями"], "bact": ["Визуализации", "Конспект с визуализациями"], "microlab": ["Лаборатория", "Конспект с визуализациями"], "bioinf": ["Лаборатория", "Конспект с визуализациями"], "qs": ["Лаборатория", "Конспект с визуализациями"]};
async function bvLoad(){
  const h=$('#bvhost');
  const root=h.shadowRoot||h.attachShadow({mode:'open'});
  root.innerHTML=`<style>:host{display:block}.ld{display:flex;align-items:center;gap:14px;padding:48px 4px;color:var(--muted);font-size:15px}
    .sp{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--bio);animation:r .8s linear infinite}
    @keyframes r{to{transform:rotate(1turn)}}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--ink);color:var(--card);font-weight:600}</style>
    <div class="ld"><span class="sp"></span>Загружаю визуализации и банк задач…</div>`;
  window.BVHOST={host:h,root,on:true,defer:true,top:()=>window.scrollTo(0,0),dlg:()=>!!document.querySelector('dialog[open]'),full:bvFull,
    answer:a=>{try{BVHOST.afterAnswer&&BVHOST.afterAnswer(a)}catch(e){}},
    // «Мои ошибки» в банке задач: всё, что решено неверно, во всех сборниках (считается по прогрессу в этом браузере)
    bvErr:()=>{try{return window.BV&&BV.tasksPending?BV.tasksPending().map(x=>({src:x.src,id:x.id})):[]}catch(e){return []}}};
  const ld=()=>root.querySelector('.ld');
  const slow=setTimeout(()=>{const l=ld();if(l)l.insertAdjacentHTML('beforeend','<span style="display:block;width:100%;font-size:13.5px">Интернет медленный, ещё загружаю. Страница откроется сама.</span>')},9000);
  const fail=msg=>{clearTimeout(slow);const l=ld();if(l){l.innerHTML=msg+' <button>Повторить</button>';l.querySelector('button').onclick=()=>location.reload()}};
  const CORE=['bioviz/lib/three.min.js','bioviz/x/vuz-tasks.js','bioviz/x/qs-tasks.js','bioviz/bv.js'];
  bvPreload(CORE.concat(BV_EXTRA));
  const missed=[];
  try{
    if(!await bvTry(CORE[0],2))console.warn('3D-библиотека не загрузилась: 3D-модели покажут заглушку');
    if(!await bvTry(CORE[1],3))missed.push('вузовские задачи');
    if(!await bvTry(CORE[2],3))missed.push('задачи по микробной экологии');
    if(!await bvTry(CORE[3],4)||!window.BV||!BV.start){fail('Не получилось загрузить БиоВиз. Проверьте интернет.');return}
    for(const s of BV_EXTRA){if(!await bvTry(s,3))missed.push(s.replace(/^.*\//,''))}
    clearTimeout(slow);
    BV.start();
    /* правки конспектов от владельца: грузятся после запуска и не задерживают его; если файл не загрузится, конспекты просто показываются без правок */
    setTimeout(()=>{bvTry('bioviz/x/kedit-view.js',3).then(ok=>{if(!ok)console.warn('Правки конспектов не загрузились')})},0);
    if(missed.length){const n=document.createElement('div');n.setAttribute('role','status');
      n.style.cssText='position:fixed;z-index:95;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));max-width:calc(100vw - 24px);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--sh2);font-size:14px;display:flex;gap:10px;align-items:center';
      n.innerHTML='Часть разделов не загрузилась ('+missed.length+'). <button style="all:unset;cursor:pointer;font-weight:700;color:var(--ink)">Обновить</button><button aria-label="Закрыть" style="all:unset;cursor:pointer;color:var(--muted);font-size:18px">×</button>';
      const bs=n.querySelectorAll('button');bs[0].onclick=()=>location.reload();bs[1].onclick=()=>n.remove();document.body.appendChild(n);console.warn('Не загрузились:',missed)}
  }catch(e){
    console.error(e);fail('БиоВиз не запустился из-за ошибки. Обнови страницу; если не поможет, напиши учителю.');
  }
}
bvLoad();
</script>

</body></html>
