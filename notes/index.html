<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f8ff">
  <title>Поля · заметки</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous"
    integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" crossorigin="anonymous"
    integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="library" aria-label="Библиотека">
      <header class="brand"><img src="icon.svg" alt=""><div><b>Поля</b><small>Библиотека заметок</small></div><button id="hide-library" type="button" aria-label="Закрыть библиотеку">×</button></header>
      <label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="Поиск в библиотеке" aria-label="Поиск в библиотеке"></label>
      <button id="new-item" type="button" class="primary">＋ Создать</button>
      <nav id="tree" aria-label="Папки и заметки"></nav>
      <footer><button id="sync" type="button">Локальная библиотека</button><button id="account" type="button">Войти</button></footer>
    </aside>
    <main id="workspace">
      <header class="editor-header">
        <button id="show-library" type="button" aria-label="Библиотека">☰</button>
        <input id="title" hidden aria-label="Название заметки">
        <span id="heading">Все заметки</span>
        <button id="more" type="button" aria-label="Действия с заметкой" hidden>•••</button>
      </header>
      <div id="tools" hidden></div>
      <div id="content"></div>
    </main>
  </div>
  <dialog id="dialog"></dialog>
  <div id="message" role="status" aria-live="polite"></div>
  <input id="file-picker" type="file" accept=".pdf,.txt,image/*,video/*" multiple hidden>
</body>
</html>
