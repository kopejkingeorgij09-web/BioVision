<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" width="1200" height="485"><title>Увеличение N-гликозидной связи между C1′ дезоксирибозы и N1 урацила. После гидролиза урацил становится свободным.</title><rect width="1200" height="485" rx="16" fill="#FFFDF8"/><defs><marker id="end" viewBox="0 0 10 10" markerWidth="4" markerHeight="4" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><text x="99" y="87" fill="#48616A" font-family="Arial, sans-serif" font-weight="700" font-size="23" text-anchor="start" dominant-baseline="central">Дезоксирибоза в непрерывном остове</text><line x1="193" y1="209" x2="219" y2="193" stroke="#20576A" stroke-width="3" stroke-linecap="round"/><line x1="219" y1="193" x2="246" y2="210" stroke="#20576A" stroke-width="3" stroke-linecap="round"/><line x1="246" y1="210" x2="237" y2="243" stroke="#20576A" stroke-width="3" stroke-linecap="round"/><line x1="237" y1="243" x2="201" y2="243" stroke="#20576A" stroke-width="3" stroke-linecap="round"/><line x1="201" y1="243" x2="193" y2="209" stroke="#20576A" stroke-width="3" stroke-linecap="round"/><circle cx="219" cy="221" r="14" fill="#FFFDF8" stroke="#FFFDF8" stroke-width="0"/><text x="219" y="221" fill="#142C34" font-family="Arial, sans-serif" font-weight="700" font-size="17" text-anchor="middle" dominant-baseline="central">C1′</text><line x1="246" y1="219" x2="376" y2="219" stroke="#20576A" stroke-width="4" stroke-linecap="round"/><line x1="300" y1="238" x2="313" y2="200" stroke="#9B3D24" stroke-width="4" stroke-linecap="round"/><line x1="311" y1="238" x2="324" y2="200" stroke="#9B3D24" stroke-width="4" stroke-linecap="round"/><text x="384" y="219" fill="#9B3D24" font-family="Arial, sans-serif" font-weight="700" font-size="37" text-anchor="start" dominant-baseline="central">N1 — урацил</text><text x="100" y="352" fill="#48616A" font-family="Arial, sans-serif" font-weight="400" font-size="23" text-anchor="start" dominant-baseli