<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Стенд драконов 6.0</title>
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--ink:#1E2230;--quiet:#5E6475;--line:#DDE2EA;--acc:#2F6FD6;--accbg:#E7EFFC;--stage:#dfe9f2;--ground:#b9cfa0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161C;--card:#1D2029;--ink:#E8EAF0;--quiet:#A0A6B5;--line:#2E3340;--acc:#7DA8F0;--accbg:#22304A;--stage:#1f2a36;--ground:#2c3a2a}}
:root[data-theme="dark"]{--bg:#14161C;--card:#1D2029;--ink:#E8EAF0;--quiet:#A0A6B5;--line:#2E3340;--acc:#7DA8F0;--accbg:#22304A;--stage:#1f2a36;--ground:#2c3a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:20px;margin:0 0 4px}
header p{margin:0 0 10px;color:var(--quiet);max-width:860px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accbg);color:var(--acc);font-weight:600}
main{padding:12px 16px 60px;max-width:1400px;margin:0 auto}
#big{width:100%;height:min(56vh,460px);display:block;border-radius:14px;background:linear-gradient(var(--stage) 72%,var(--ground) 72%);border:1px solid var(--line)}
#bigname{margin:8px 0 18px;color:var(--quiet)}
h2{font-size:17px;margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;min-width:0}
.card[aria-current="true"]{outline:2px solid var(--acc)}
.card canvas{width:100%;aspect-ratio:3/2;display:block;border-radius:8px;background:linear-gradient(var(--stage) 75%,var(--ground) 75%)}
.card div{font-size:13px;margin-top:4px;color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:0}
</style>
</head>
<body>
<header>
<h1>Стенд драконов 6.0</h1>
<p>Все 63 дракона: 7 обычных, 21 редкий, 35 эпических. Тело гнётся по скелету, крылья даёт вторая стихия. Нажми на дракона, чтобы посмотреть крупно.</p>
<div class="ctl">
 <div class="seg" id="st"></div>
 <div class="seg" id="fc"><button data-f="1" aria-pressed="true">→</button><button data-f="-1">←</button></div>
</div>
</header>
<main>
<canvas id="big"></canvas>
<div id="bigname"></div>
<div id="groups"></div>
</main>
<script src="art6/manifest.js"></script>
<script src="dr6art.js"></script>
<script>
(function(){'use strict';
const A=DR6ART,M=DR6ART_MANIFEST;
const LABEL={idle:'Покой',walk:'Шаг',fly:'Полёт',attack:'Атака',hit:'Попадание',win:'Победа',sleep:'Сон'};
const ONCE={attack:1.6,hit:1,win:99};
let state='idle',face=1,sel='FWA'.slice(0,1),t0=performance.now(),s0=t0;
const keys=A.all(),groups=[[1,'Обычные'],[2,'Редкие'],[3,'Эпические']];
const name=k=>k.split('').map(e=>A.NAME[e]).join(', ');
const dots=k=>k.split('').map(e=>'<span class="dot" style="background:'+A.COL[e]+'"></span>').join('');
const st=document.getElementById('st');
A.STATES.forEach(s=>{const b=document.createElement('button');b.textContent=LABEL[s];b.dataset.s=s;b.setAttribute('aria-pressed',s===state);st.appendChild(b)});
st.onclick=e=>{const b=e.target.closest('button');if(!b)return;state=b.dataset.s;s0=performance.now();st.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
document.getElementById('fc').onclick=e=>{const b=e.target.closest('button');if(!b)return;face=+b.dataset.f;e.currentTarget.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
const cards=[],G=document.getElementById('groups');
groups.forEach(([n,title])=>{const ks=keys.filter(k=>k.length===n);const h=document.createElement('h2');h.textContent=title+' ('+ks.length+')';G.appendChild(h);
 const g=document.createElement('div');g.className='grid';G.appendChild(g);
 ks.forEach((k,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<canvas></canvas><div>'+dots(k)+name(k)+'</div>';c.onclick=()=>pick(k);g.appendChild(c);
  cards.push({k,c,cv:c.querySelector('canvas'),seed:i*1.37+n,vis:false})})});
const io=new IntersectionObserver(es=>es.forEach(e=>{const o=cards.find(x=>x.c===e.target);if(o)o.vis=e.isIntersecting}),{rootMargin:'100px'});
cards.forEach(o=>io.observe(o.c));
function pick(k){sel=k;cards.forEach(o=>o.c.setAttribute('aria-current',o.k===k));
 // для гибрида крылья второй стихии, у обычного свои
 document.getElementById('bigname').innerHTML=dots(k)+'<b>'+name(k)+'</b> · '+['','обычный','редкий','эпический'][k.length]+' · крылья: '+A.NAME[A.wingKey(k.split(''))];
 A.preload(k.split(''));s0=performance.now()}
pick(keys.includes('FA')?'FA':keys[0]);
function fit(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}return d}
const big=document.getElementById('big');
function frame(now){const t=(now-t0)/1000;let s=(now-s0)/1000;
 if(ONCE[state]&&ONCE[state]<99&&s>ONCE[state]+.6){s0=now;s=0}
 const d=fit(big),x=big.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,big.width,big.height);
 const S=Math.min(big.width*.62,big.height*1.25);
 A.draw(x,{els:sel.split(''),x:big.width/2,y:big.height*.86,size:S,face,state,t,s,detail:1});
 for(const o of cards){if(!o.vis)continue;const d2=fit(o.cv),c=o.cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,o.cv.width,o.cv.height);
  if(!A.draw(c,{els:o.k.split(''),x:o.cv.width/2,y:o.cv.height*.9,size:o.cv.width*.82,face,state,t,s,seed:o.seed,detail:0}))A.preload(o.k.split(''))}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
