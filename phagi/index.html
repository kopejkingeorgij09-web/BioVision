    return openDlg(`<div class="tk-card" style="--c:${tkBc(x.block)}"><div class="tk-meta"><span>${nums[x.id]||''}</span><span class="sj">${TK_SJ[tkS(x)]}</span><span class="bl">${esc(tkBn(x.block,0))}</span></div><h2>${esc(x.title)}</h2>
      <p class="muted" style="margin-top:-6px">${esc(fmtDayW(x.date))}${x.time?', '+esc(x.time):''}</p>
      ${(x.points||[]).length?`<span class="tk-lbl">Что разбираем</span><ul>${x.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
      ${x.hw?`<span class="tk-lbl">Домашнее задание</span><div>${esc(x.hw)}${x.due?`, до ${esc(fmtDayW(x.due))}`:''}</div>`:''}
      <span class="tk-lbl">Этап</span><div>${lg?`<span class="tk-pill">отстаёт: ${lg}</span> `:''}${TK_ST[x.stage|0]}</div>
      ${x.note?`<span class="tk-lbl">Заметка учителя</span><div>${esc(x.note)}</div>`:''}</div>
      <div class="actions"><button class="btn" data-dact="close">Закрыть</button></div>`,{close:closeDlg});
  }
  const isNew=!x.id,ev=x.kind==='event';let stage=x.stage|0;
  const body=ev?`<h2>${isNew?'Новая дата':'Дата олимпиады'}</h2><p class="muted small" style="margin-top:-6px">Трекер: ${esc(name(uid))}</p>
    <label>Название<input name="title" maxlength="140" value="${esc(x.title)}" placeholder="Например: отборочный этап БИБН"></label>
    <div class="row"><label class="grow">Начало<input type="date" name="date" value="${esc(x.date)}"></label><label class="grow">Конец, если несколько дней<input type="date" name="end" value="${esc(x.end||'')}"></label></div>
    <label>Пояснение<textarea name="note" rows="2">${esc(x.note||'')}</textarea></label>`
  :`<h2>${isNew?'Новое занятие':'Занятие'}</h2><p class="muted small" style="margin-top:-6px">Трекер: ${esc(name(uid))}</p>
    <label>Тема<input name="title" maxlength="140" value="${esc(x.title)}" placeholder="Например: Ядро и хроматин"></label>
    <div class="row"><label class="grow">Предмет и блок<select name="block">${['bio','math'].map(sj=>`<optgroup label="${TK_SJ[sj]}">${Object.entries(TK_BL).filter(([k])=>tkBs(k)===sj).map(([k,v])=>`<option value="${k}" ${x.block===k?'selected':''}>${v[0]}</option>`).join('')}</optgroup>`).join('')}</select></label><label class="grow">Дата<input type="date" name="date" value="${esc(x.date)}"></label></div>
    <span class="tk-lbl" style="margin-top:0">Этап</span><div class="tk-stages">${TK_ST.map((s,i)=>`<button type="button" data-dact="st" data-v="${i}" aria-pressed="${stage===i}">${s}</button>`).join('')}</div>
    <label>Заметка, её видит ученица<textarea name="note" rows="2">${esc(x.note||'')}</textarea></label>
    <div class="row"><label class="grow">Время<input name="time" maxlength="40" value="${esc(x.time||'')}" placeholder="19:00–21:00"></label><label class="grow">Срок ДЗ<input type="date" name="due" value="${esc(x.due||'')}"></label></div>
    <label>Домашнее задание<input name="hw" maxlength="300" value="${esc(x.hw||'')}"></label>
    <label>Что разбираем, по пункту в строке<textarea name="points" rows="3">${esc((x.points||[]).join('\n'))}</textarea></label>`;
  openDlg(body+`<p class="err"></p><div class="actions">${isNew?'':'<button class="btn danger" data-dact="del" style="margin-right:auto">Удалить</button>'}<button class="btn ghost" data-dact="cancel">Отмена</button><button class="btn" data-dact="save">${isNew?'Добавить':'Сохранить'}</button></div>`,{
    cancel:closeDlg,
    st:el=>{stage=Number(el.dataset.v);$('#dlgbox').querySelectorAll('.tk-stages button').forEach(b=>b.setAttribute('aria-pressed',b===el))},
    del:async()=>{if(!await askConfirm(ev?'Удалить дату олимпиады?':'Удалить занятие из трекера?'))return;await S.db.doc(`track/${uid}/items/${x.id}`).delete();toast('Удалено')},
    save:async()=>{
      const data={kind:x.kind,title:fv('title').trim(),date:fv('date'),note:fv('note').trim(),updatedAt:now()};
      if(!data.title)return dlgErr(ev?'Впишите название':'Впишите тему');if(!data.date)return dlgErr('Выберите дату');
      if(ev){data.end=fv('end');if(data.end&&data.end<data.date)return dlgErr('Конец раньше начала')}
      else Object.assign(data,{block:fv('block'),subj:tkBs(fv('block')),time:fv('time').trim(),due:fv('due'),hw:fv('hw').trim(),stage,points:fv('points').split('\n').map(s=>s.trim()).filter(Boolean)});
      if(isNew){data.createdAt=now();await S.db.collection(`track/${uid}/items`).add(data)}else await S.db.doc(`track/${uid}/items/${x.id}`).set(data);
      closeDlg();toast(isNew?'Добавлено в трекер':'Сохранено')}
  });
}
Object.assign(actions,{
  tkuid:el=>{S.trUid=el.dataset.uid;S.trF='all';S.trB='';S.trS=''},
  tks:el=>{S.trS=el.dataset.v||'';S.trB=''},
  tktab:el=>{S.trTab=el.dataset.v==='prog'?'prog':'plan'},
  tkf:el=>{S.trF=el.dataset.v},
  tkb:el=>{S.trB=el.dataset.v||''},
  tkopen:el=>tkOpen(el.dataset.id),
  tknew:el=>tkOpen(null,el.dataset.k),
  tkadv:async el=>{const uid=tkUid(),x=(S.track[uid]||[]).find(i=>i.id===el.dataset.id);if(!x)return;
    const st=x.stage|0,next=Math.min(4,tkLag(x)==='ДЗ'?Math.max(st,2):st+1);
    await S.db.doc(`track/${uid}/items/${x.id}`).update({stage:next,updatedAt:now()});toast('Этап: '+TK_ST[next].toLowerCase())}
});

/* режим владельца: «Учитель» или «Ученик». Смена режима сохраняет несохранённый прогресс и перезагружает страницу,
   потому что подписки на данные у учителя и ученика разные */
const ROLE_K='ph_role';
function roleGet(){try{return localStorage.getItem(ROLE_K)||''}catch{return ''}}
async function roleSet(r){if(!S.dual||r===S.mode)return;
  /* вошли ученическим кодом: для учителя нужен код учителя, ответы ученика сначала сохраняются */
  if(r==='teacher'&&!S.me.isOwner){try{if(draftTask)draftSave()}catch{}if(dirty.size||streakDirty)flush();if(window.PHCLOUD&&PHCLOUD.teacherLogin)PHCLOUD.teacherLogin();return}
  const sw=$('#rolesw');sw.classList.add('busy');
  try{if(draftTask)draftSave()}catch{}
  if(dirty.size||streakDirty)flush();
  try{await Promise.race([chain,new Promise(f=>setTimeout(f,4000))])}catch{}
  try{localStorage.setItem(ROLE_K,r)}catch{}
  location.reload()}
$('#rolesw').addEventListener('click',e=>{const b=e.target.closest('button[data-role]');if(!b)return;
  /* на телефоне видна только кнопка текущего режима: нажатие переключает на другой */
  roleSet(b.dataset.role===S.mode?(T()?'student':'teacher'):b.dataset.role)});

(async()=>{
  render();
  if(!window.claude||!window.claude.use){S.mode='nodb';return render()}
  const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){S.mode='nodb';return render()}
  S.db=db;S.user=user;S.me=await user.me();
  thUser(S.me&&(S.me.isOwner?'owner':S.me.id));
  try{S.assets=await claude.use('assets')}catch{S.assets=null}
  claude.use('downloads').then(d=>{S.dl=d||null}).catch(()=>{S.dl=null});
  claude.use('sample').then(s=>{S.sample=s||null;if(S.view==='review')render()}).catch(()=>{S.sample=null});
  if(!S.me.isOwner&&!S.me.id){S.mode='noid';return render()}
  /* учитель и его ученический профиль это один аккаунт: режим выбирается переключателем в шапке */
  /* вход по ученическому коду Георгия — тот же профиль: переключатель виден, «Учитель» просит код учителя.
     Признак берётся из базы (teach) или с устройства, где уже входили кодом учителя */
  try{if(S.me.isOwner)localStorage.setItem('ph_teach_dev',S.me.id)}catch{}
  let devT=false;try{devT=localStorage.getItem('ph_teach_dev')===S.me.id}catch{}
  S.dual=!!S.me.isOwner||!!S.me.teach||devT;
  S.mode=S.me.isOwner&&roleGet()!=='student'?'teacher':'student';
  subscribe();render();
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js').then(()=>{KX=window.katex||null;render()}).catch(()=>{});
})();
</script>
</body>
