const wallKey=cell=>cell.x+','+cell.y;
function wallCells(corners){
 const route=new Map();
 if(!corners.length)return [];
 let {x,y}=corners[0];
 const visit=()=>{const cell={x,y};route.set(wallKey(cell),cell)};
 visit();
 for(const target of corners.slice(1)){
  const across=()=>{while(x!==target.x){x+=Math.sign(target.x-x);visit()}};
  const along=()=>{while(y!==target.y){y+=Math.sign(target.y-y);visit()}};
  if(Math.abs(target.x-x)>=Math.abs(target.y-y)){across();along()}else{along();across()}

}
function quoteWalls(corners){

 let blocked=false;
 for(const cell of route){
  const b=occupied.get(wallKey(cell));
  if(b?.type==='wall')continue;
  preview.push(cell);
  if(b||!containsCell(grid,cell.x,cell.y)){blocked=true;continue}
  fresh.push(cell);
 }
 const room=wallCapacity()-s.buildings.filter(b=>b.type==='wall').length;
 const available=Math.max(0,Math.min(room,grid.width*grid.height-occupied.size,Math.floor(s.gold/unit)));
 const total=fresh.length*unit;
 let issue='';
 if(blocked)issue='Линия пересекает постройку или край острова.';
 else if(fresh.length>room)issue='Достигнут лимит секций. Укороти линию.';
 else if(total>s.gold)issue='Для всей линии нужно ещё '+num(total-s.gold)+' золота.';

 const r=world.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top);
});
world.addEventListener('keydown',e=>{
 if(battle)return;if(e.key==='Escape'){acts.cancelplace();return}
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;e.preventDefault();
 cursor??={x:4,y:4};if(e.key==='Enter'||e.key===' '){useCell(cursor,null);return}
 if(e.key==='ArrowLeft')cursor.x--;if(e.key==='ArrowRight')cursor.x++;if(e.key==='ArrowUp')cursor.y--;if(e.key==='ArrowDown')cursor.y++;
 const grid=islandGrid(s);cursor.x=Math.max(0,Math.min(grid.width-1,cursor.x));cursor.y=Math.max(0,Math.min(grid.height-1,cursor.y));
});
function resize(){
 const r=world.getBoundingClientRect();W=r.width;H=r.height;const dpr=Math.min(devicePixelRatio||1,2);
 world.width=Math.round(W*dpr);world.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paintMini();
}
// Night reports replay the stored server events against the island as it looked at raid time.
const nightDialog=document.createElement('dialog');nightDialog.id='night-report';nightDialog.setAttribute('aria-labelledby','night-title');
nightDialog.innerHTML='<div class="dlghead"><h2 id="night-title">Ночной дозор</h2><button type="button" class="close" aria-label="Закрыть отчёты">×</button></div><div class="dlgbody night-body"></div>';
document.body.append(nightDialog);
const nightBody=nightDialog.querySelector('.night-body'), nightBanner=document.createElement('section');nightBanner.className='night-banner panel';nightBanner.hidden=true;
const nightArchive=document.createElement('button');nightArchive.type='button';nightArchive.className='linkbtn';nightArchive.textContent='Отчёты о ночных набегах';nightArchive.hidden=!host;
const attribution=document.querySelector('.attribution');if(attribution)attribution.insertBefore(nightArchive,attribution.lastElementChild);
document.querySelector('.play')?.before(nightBanner);
let raids=[],raidAt=0,raidClock=0,raidPlaying=false,raidFrame=0,raidPrevious=0,raidScene=null,raidRequest=0,nightSeen='';
try{if(host)nightSeen=localStorage.getItem(key+'.seenRaid')||'';}catch{}
function raidDate(day){const t=Date.parse(String(day).slice(0,10)+'T12:00:00Z');return Number.isFinite(t)?new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',timeZone:'Europe/Moscow'}).format(t):'Ночной набег';}
function raidsLoss(r){return 'Золото −'+num(Math.max(0,Number(r.goldLost)||0))+' · ягоды −'+num(Math.max(0,Number(r.berriesLost)||0));}
function refreshNightBanner(){
 const r=s.lastRaid;nightBanner.hidden=!host||!r?.day||nightSeen===r.day;
 if(nightBanner.hidden||nightBanner.dataset.day===r.day)return;
 nightBanner.dataset.day=r.day;nightBanner.innerHTML='<div><h3>Ночной набег · '+escape(raidDate(r.day))+'</h3><p>'+escape(raidsLoss(r))+'</p></div><button class="cmd alt" type="button">Посмотреть отчёт</button>';
}
function resetRaidScene(r){
 const rp=r.replay||{}, actors=new Map(), buildings=new Map();
 for(const b of Array.isArray(rp.buildings)?rp.buildings:[])if(b?.id&&Object.hasOwn(STRUCT,b.type))buildings.set(b.id,{...b,maxHP:b.hp,alive:true});
 for(const [side,list] of [['attacker',rp.attackers],['defender',rp.defenders]])for(const a of Array.isArray(list)?list:[]){
  if(a?.id)actors.set(a.id,{...a,side,maxHP:a.hp,alive:true});
 }
 const events=(Array.isArray(rp.events)?rp.events:[]).filter(e=>e&&Number.isFinite(e.t)).map(e=>({...e})).sort((a,b)=>a.t-b.t);
 // Events within the same server tick keep their order and can be reviewed one by one.
 for(let start=0;start<events.length;){let end=start+1;while(end<events.length&&events[end].t===events[start].t)end++;
  const span=Math.min(.8,Math.max(0,(events[end]?.t??events[start].t+1)-events[start].t));
  for(let i=start;i<end;i++)events[i].at=events[i].t+span*(i-start)/(end-start);start=end;
 }
 const dimension=(n,fallback)=>Number.isInteger(n)&&n>=10&&n<=16?n:fallback;
 const side=dimension(rp.gridSize,10),width=dimension(rp.gridWidth,side),height=dimension(rp.gridHeight,side);
 raidScene={actors,buildings,events,side,width,height,index:0,last:-1,caption:'Налётчики приближаются к острову.',effects:[]};
}
function applyRaidEvents(t){
 if(!raidScene||t<raidScene.last)resetRaidScene(raids[raidAt]);
 const scene=raidScene;
 while(scene.index<scene.events.length&&scene.events[scene.index].at<=t){
  const e=scene.events[scene.index++],actor=scene.actors.get(e.id),target=scene.actors.get(e.target)||scene.buildings.get(e.target);
  if(e.kind==='move'&&actor&&Array.isArray(e.to)){actor.x=e.to[0];actor.y=e.to[1];actor.step=e;}
  if(['tower','guard','wall','trap','strike'].includes(e.kind)){
   if(target&&Number.isFinite(e.hp))target.hp=e.hp;
   scene.effects.push(e);
   if(e.kind==='trap'&&scene.buildings.has(e.id))scene.buildings.get(e.id).spent=true;
  }
  if((e.kind==='destroy'||e.kind==='fall')&&target)target.alive=false;
  if(e.text)scene.caption=e.text;
 }
 scene.effects=scene.effects.filter(e=>t-e.at<0.7);scene.last=t;
}
function raidTime(t){const n=Math.max(0,Math.floor(t));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function raidDuration(){const r=raids[raidAt]?.replay;if(!r)return 0;return Math.max(0,Number(r.duration)||0,raidScene?.events.at(-1)?.at||0);}
function drawRaid(){
 const canvas=nightBody.querySelector('canvas');if(!canvas||!raidScene)return;
 applyRaidEvents(raidClock);
 const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height),dpr=Math.min(2,window.devicePixelRatio||1);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
 const c=canvas.getContext('2d');if(!c)return;c.setTransform(dpr,0,0,dpr,0,0);
 const activeTime=reduced?Math.floor(raidClock):raidClock,scene=raidScene, buildings=[...scene.buildings.values()].filter(b=>b.alive&&!b.spent);
 const side=scene.side;canvas.setAttribute('aria-label','Запись обороны острова '+scene.width+'×'+scene.height);
 Art.island(c,w,h,activeTime,{buildings,dragons:[],grid:false,gridSize:side,gridWidth:scene.width,gridHeight:scene.height,theme:'defense'});
 const unit=Math.max(8,Math.min(w/18,h/11)*10/side),spot=(x,y)=>Art.point(x,y,w,h,side);
 function health(entity,p,off){if(!entity.maxHP||entity.hp>=entity.maxHP)return;const bar=Math.min(34,unit*1.25);c.fillStyle='#28392e';c.fillRect(p.x-bar/2,p.y-off,bar,3);c.fillStyle=entity.side==='attacker'?'#fb9e79':'#aed785';c.fillRect(p.x-bar/2,p.y-off,bar*Math.max(0,entity.hp/entity.maxHP),3);}
 for(const b of buildings)health(b,spot(b.x,b.y),unit*1.05);
 for(const a of [...scene.actors.values()].filter(x=>x.alive).sort((p,q)=>p.x+p.y-q.x-q.y)){
  let x=a.x,y=a.y;const step=a.step;
  if(raidPlaying&&!reduced&&step&&Array.isArray(step.from)){const k=Math.min(1,Math.max(0,(raidClock-step.at)/.35));x=step.from[0]+(a.x-step.from[0])*k;y=step.from[1]+(a.y-step.from[1])*k;}
  const p=spot(x,y),enemy=a.side==='attacker';c.beginPath();c.ellipse(p.x,p.y+2,unit*.55,unit*.22,0,0,Math.PI*2);c.fillStyle=enemy?'#a42e34bd':'#195d55c4';c.fill();
  const altitude=a.flying?unit*.9:unit*.46;
  Art.dragon(c,p.x,p.y-altitude,unit*1.4,Number(a.species)||0,Number(a.level)||1,activeTime,enemy);health(a,p,altitude+unit*.65);
 }
 if(!reduced)for(const e of scene.effects.slice(-15)){
  if(!Array.isArray(e.from)||!Array.isArray(e.to))continue;
  const src=spot(...e.from),dst=spot(...e.to);c.save();c.globalAlpha=.75*(1-Math.min(1,(raidClock-e.at)/.7));c.strokeStyle=['tower','guard','trap'].includes(e.kind)?'#f8df70':'#df735d';c.lineWidth=2;c.beginPath();c.moveTo(src.x,src.y-unit*.45);c.lineTo(dst.x,dst.y-unit*.35);c.stroke();c.restore();
 }
 const range=nightBody.querySelector('[data-night-seek]');if(range){range.value=String(raidClock);range.setAttribute('aria-valuetext',raidTime(raidClock));}
 const duration=raidDuration();nightBody.querySelector('[data-night-time]').textContent=raidTime(raidClock)+' / '+raidTime(duration);
 nightBody.querySelector('[data-night-event]').textContent=scene.caption;
 const toggle=nightBody.querySelector('[data-night-play]');toggle.textContent=raidPlaying?'Пауза':raidClock>=duration?'Сначала':'Воспроизвести';toggle.setAttribute('aria-pressed',String(raidPlaying));
}
function pauseRaid(){raidPlaying=false;cancelAnimationFrame(raidFrame);raidFrame=0;}
function stepRaid(now){
 if(!raidPlaying||!nightDialog.open||document.hidden){pauseRaid();if(nightDialog.open)drawRaid();return;}
 if(raidPrevious)raidClock=Math.min(raidDuration(),raidClock+Math.max(0,now-raidPrevious)/1000);raidPrevious=now;
 if(raidClock>=raidDuration())pauseRaid();drawRaid();if(raidPlaying)raidFrame=requestAnimationFrame(stepRaid);
}
const raidRules='<details class="night-rules"><summary>Правила ночного дозора</summary><p>Набег начинается в 03:00 по Москве. Налётчики получают по звезде за разрушение половины целей, цитадели и всех целей. Стены и ловушки в число целей не входят.</p><p>За 0, 1, 2 и 3 звезды налётчики забирают соответственно 0%, 25%, 50% и 80% золота и ягод. В расчёт входят и несобранные запасы на острове.</p></details>';
function displayRaid(index){
 pauseRaid();raidAt=index;raidClock=0;const r=raids[index];if(!r)return;resetRaidScene(r);
 const stars=Math.max(0,Math.min(3,Math.trunc(r.stars)||0)),list=raids.map((x,i)=>'<option value="'+i+'"'+(i===index?' selected':'')+'>'+escape(raidDate(x.day))+' · волна '+escape(x.wave??1)+'</option>').join('');
 nightBody.innerHTML='<label>Запись набега<select class="pick" data-night-date>'+list+'</select></label><div class="night-summary"><div><h3>'+(stars===0?'Остров выстоял':'Налётчики заработали '+stars+' '+(stars===1?'звезду':'звезды'))+'</h3><p>'+escape(raidsLoss(r))+'</p></div><span aria-label="Звёзды налётчиков '+stars+' из трёх">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</span></div>';
 if(!r.replay||!raidScene.events.length){nightBody.insertAdjacentHTML('beforeend','<p>Для этого набега сохранилась только сводка.</p>'+raidRules);return;}
 nightBody.insertAdjacentHTML('beforeend','<canvas class="night-map" role="img" aria-label="Запись обороны острова"></canvas><div class="night-legend"><span>● Защитники</span><span>● Налётчики</span><span data-night-time></span></div><input data-night-seek aria-label="Перемотка записи" type="range" min="0" step="0.1" max="'+raidDuration()+'" value="0"><div class="actions night-actions"><button type="button" class="cmd" data-night-play>Воспроизвести</button><button type="button" class="cmd alt" data-night-step>Следующее событие</button></div><p data-night-event></p>'+raidRules);
 nightBody.querySelector('[data-night-seek]').addEventListener('input',e=>{pauseRaid();raidClock=Number(e.target.value);drawRaid();});
 nightBody.querySelector('[data-night-play]').onclick=()=>{if(raidPlaying){pauseRaid();drawRaid();return;}if(raidClock>=raidDuration())raidClock=0;raidPrevious=0;raidPlaying=true;drawRaid();raidFrame=requestAnimationFrame(stepRaid);};
 nightBody.querySelector('[data-night-step]').onclick=()=>{pauseRaid();raidClock=raidScene.events.find(e=>e.at>raidClock)?.at??raidDuration();drawRaid();};drawRaid();
}
async function openNight(){
 if(!host)return;pauseRaid();const generation=++raidRequest;
 nightBody.innerHTML='<p role="status">Загружаем записи ночных набегов…</p>';if(!nightDialog.open)nightDialog.showModal();
 try{
  const reports=await host.loadRaids();if(!nightDialog.open||generation!==raidRequest)return;
  if(!Array.isArray(reports))throw Error('reports');raids=reports.filter(r=>r&&/^\d{4}-\d{2}-\d{2}$/.test(r.day));
  if(!raids.length){nightBody.innerHTML='<h3>Ночных набегов пока не было</h3><p>Дозор проверяет остров в 03:00 по Москве. После первого налёта здесь появятся отчёт и запись боя.</p>'+raidRules;return;}
  nightSeen=raids[0].day;try{localStorage.setItem(key+'.seenRaid',nightSeen)}catch{}refreshNightBanner();displayRaid(0);
 }catch(e){if(!nightDialog.open||generation!==raidRequest)return;nightBody.innerHTML='<p role="status"></p><button class="cmd alt" type="button">Попробовать снова</button>';nightBody.querySelector('p').textContent=e?.dbCode==='PGRST202'?'Архив ночных набегов ждёт подключения к платформе.':'Не удалось загрузить отчёты. Проверь связь с «Фагами».';nightBody.querySelector('button').onclick=openNight;}
}
nightArchive.dataset.nightOpen='';nightBanner.dataset.nightOpen='';
body.addEventListener('click',e=>{if(e.target.closest('[data-night-open]'))openNight()});
nightArchive.onclick=openNight;nightBanner.onclick=openNight;nightDialog.querySelector('.close').onclick=()=>nightDialog.close();nightDialog.addEventListener('close',()=>{raidRequest++;pauseRaid();});
nightBody.addEventListener('change',e=>{if(e.target.matches('[data-night-date]'))displayRaid(Number(e.target.value));});
new ResizeObserver(()=>{if(nightDialog.open&&raidScene)drawRaid()}).observe(nightBody);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&raidPlaying){pauseRaid();drawRaid();}});

function frame(ms){
 requestAnimationFrame(frame);
 if(document.hidden||!W||!H){lastFrame=ms;return}
 const sec=ms/1000,dt=lastFrame?Math.min(.1,(ms-lastFrame)/1000):0;lastFrame=ms;moment=reduced?0:sec;
 if(battle){if(!dlg.open)battle.tick(dt);if(battle)battle.draw(ctx,W,H,moment)}
 else if(!dlg.open||panel==='hatched'){
  sampleMap();Art.island(ctx,W,H,moment,stateArt);
  flying=flying.filter(f=>sec-f.born<1.4);
  for(const f of flying){const age=sec-f.born,p=Art.point(f.x,f.y,W,H,islandSize(s));ctx.save();ctx.globalAlpha=Math.max(0,1-age*.67);ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#3d553f';ctx.fillStyle=f.color;ctx.strokeText(f.txt,p.x,p.y-22-age*35);ctx.fillText(f.txt,p.x,p.y-22-age*35);ctx.restore()}
 }
 if(dlg.open&&panel==='hatched'&&!reduced&&sec-hatchAt<2.2){
   const el=body.querySelector('.portrait canvas');if(el){paintMini(body);const c=el.getContext('2d'),w=el.clientWidth,h=el.clientHeight,a=sec-hatchAt;c.save();c.fillStyle='#d39335';for(let i=0;i<18;i++){const r=a*(25+(i%4)*10);c.globalAlpha=Math.max(0,1-a/2.2);c.fillText('✦',w/2+Math.cos(i*2.4)*r,h*.48+Math.sin(i*2.4)*r)}c.restore()}
 }
 if(sec-lastSecond>=.24){lastSecond=sec;
  if(panel==='breed'&&s.egg){const l=secLeft();if(!l&&$('#egg-status')?.textContent!=='Пора вылупляться!')show('breed','',true);else if(l&&$('#egg-timer'))$('#egg-timer').textContent='До вылупления: '+l+' с'}
 }
}
addEventListener('storage',e=>{if(islandSync||e.key!==key)return;s=upgradeIsland(read());refreshIsland();if(dlg.open&&panel)show(panel,current,true)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&host)refreshStudy()});
// Establish the founding time on the first visit as well as after the first move.
if(host){
 islandSync=createIslandSync(host,key,{
  get:()=>s,
  set:(value,refresh)=>{const interrupted=refresh&&battle&&!equalIslandData(value,s);s=typeof upgradeIsland==='function'?(upgradeIsland(value)||value):value;
   if(interrupted){battle=null;placement=cursor=null;close();toast('Остров изменён на другом устройстве. Сражение завершено.');}
   if(refresh){if(!battle)refreshIsland();if(dlg.open&&panel){if(['pet','sale','hatched'].includes(panel)&&!D(current)||panel==='structure'&&!B(current))close();else show(panel,current,true)}}},
  render:()=>{if(!battle)refreshIsland();if(dlg.open&&panel==='wallet')show(panel,current,true)},
  receipt:value=>{wallet=value;walletError='';counters()},message:toast
 });islandSync.begin();
}else{try{if(!localStorage.getItem(key))save()}catch{}}
showXpRewards();new ResizeObserver(resize).observe(world);refreshIsland();resize();if(host)refreshStudy();requestAnimationFrame(frame);
})();

</script></body></html>
