function initialState() {
 const now=Date.now();
 const layout=[['keep',4,3],['mine',2,5],['farm',6,5],['home',6,2],['den',2,3],['archer',4,7],['wall',5,7]];
 return {version:1,gold:235,berries:120,buildings:layout.map(([type,x,y],i)=>({id:'b'+i,type,x,y,level:1,since:now-40000})),dragons:[0,1,2].map((species,i)=>({id:'d'+i,species,level:1})),book:[0,1,2],egg:null,quest:0,marks:{},campaign:{},waves:0,bosses:0,arenas:0,settings:{sound:false},pending:null,deliveries:[]};
}
function capacity(s){return 3+s.buildings.filter(b=>b.type==='home').reduce((n,b)=>n+3*b.level,0)}
function stored(b,now=Date.now()){
 const rates={mine:4,farm:3,home:0.85};
 if(!rates[b.type])return 0;
 return Math.max(0,Math.min(b.level*90,Math.floor((now-b.since)/1000*rates[b.type]*b.level/5)));
}
function recipe(a,b){
 const p=[a,b].sort((x,y)=>x-y);
 const exact=GAME_SPECIES.findIndex(s=>s.parents&&s.parents[0]===p[0]&&s.parents[1]===p[1]);
 if(exact>=0)return exact;
 const base=[GAME_SPECIES[a].element,GAME_SPECIES[b].element].sort((x,y)=>x-y);
 const hybrid=GAME_SPECIES.findIndex(s=>s.parents&&s.parents[1]<5&&s.parents.every((e,i)=>e===base[i]));
 return hybrid>=0?hybrid:p[0];
}

async function deliver(){
 if(!host||busy||!s.pending)return;
 const pending=s.pending;busy=true;
 try{
  const receipt=await host.buy(pending.item,pending.op);
  if(receipt.op!==pending.op||receipt.item!==pending.item)throw Error('Не совпала квитанция');
  // A second tab may have delivered this receipt while this request was in flight.
  s=read();
  if(s.pending?.op!==pending.op){wallet=receipt;return}
  if(!s.deliveries.includes(pending.op)){
   if(pending.item==='gold')s.gold+=150;
   if(pending.item==='berries')s.berries+=75;
   if(pending.item==='incubate'&&s.egg?.id===pending.egg)s.egg.end=Date.now();
   s.deliveries.push(pending.op);
  }
  s.pending=null;wallet=receipt;walletError='';save();sounds('collect');toast('Покупка получена');
 }catch(e){
  if(e?.code==='invalid_argument'){
   s=read();if(s.pending?.op===pending.op){s.pending=null;save()}toast(e.message||'Покупка отклонена');
  }else toast('Нет подтверждения. Покупку можно проверить в казне.');
 }finally{busy=false;const notice=dlg.open?$('#dnotice').textContent:'';refreshIsland();if(dlg.open&&panel){show(panel,current,true);if(notice)toast(notice)}}
}

 reset:()=>{if(s.pending||busy)return;battle=placement=cursor=null;team=[];s=initialState();close();update();toast('Остров основан заново')},
 wallet:()=>{show('wallet');syncWallet()},sync:refreshStudy,recover:deliver,purchase,
 learn:v=>{if(host)host.leave(v)},exit:()=>{if(host)host.leave('home');else if(location.protocol.startsWith('http'))location.assign('./?oplot=1');else toast('Открой «Драконий Оплот» в меню платформы «Фаги естественных наук».')},
 sound:()=>{s.settings.sound=!s.settings.sound;sounds('collect');update()},
 pet:id=>show('pet',id),structure:id=>show('structure',id),nursery:()=>show('nursery'),breed:id=>{if(D(id)){parentA=id;parentB=s.dragons.find(d=>d.id!==id)?.id}show('breed')},
 feed,lay:eggChoice,hatch,adopt:i=>{i=Number(i);if(!Number.isInteger(i)||i<0||i>4||s.gold<65||s.dragons.length>=capacity(s)-(s.egg?1:0))return;s.gold-=65;const d={id:uid(),species:i,level:1};s.dragons.push(d);if(!s.book.includes(i))s.book.push(i);sounds('hatch');update();show('pet',d.id)},
 collect:id=>{const b=B(id);if(b)collect([b])},collectall:()=>collect(s.buildings),
 construct:t=>{if(!STRUCT[t]||!canAdd(t)||s.gold<STRUCT[t][2])return;placement={kind:'add',type:t};cursor={x:4,y:4};close();refreshIsland()},
 move:id=>{if(!B(id))return;placement={kind:'move',id};cursor={x:B(id).x,y:B(id).y};close();refreshIsland()},
 edit:()=>{placement={kind:'select'};cursor=null;refreshIsland()},cancelplace:()=>{placement=cursor=null;refreshIsland()},
 upgrade:id=>{const b=B(id);if(!b||b.level>=upLimit(b)||s.gold<upCost(b))return;
   const n=stored(b);s.gold-=upCost(b);b.level++;if(n&&['mine','farm','home'].includes(b.type)){if(b.type==='farm')s.berries+=n;else s.gold+=n}b.since=Date.now();if(b.type==='wall')mark('wall');sounds('build');update()},
 quest:()=>{const q=QUESTS[s.quest];if(!q||!s.marks[q[2]])return;s.gold+=q[3];s.berries+=q[4];s.quest++;sounds('victory');update();toast('Награда главы получена')},
 mode:m=>{if(!MODE_NAMES[m])return;planned=m;team=s.dragons.slice(0,m==='arena'?3:4).map(d=>d.id);show('battle','',true)},
 team:id=>{if(!D(id))return;const n=planned==='arena'?3:4;if(team.includes(id)){if(team.length===1)return toast('Нужен хотя бы один участник.');team=team.filter(x=>x!==id)}else if(team.length<n)team.push(id);else return toast('Сначала сними отметку с одного участника.');show('battle','',true)},
 start:startFight,retreat:()=>show('retreat'),abandon:()=>{battle=null;close();refreshIsland()},
 combat:value=>{if(!battle)return;const [id,arg]=value.split('|');battle.action(id,arg===''?undefined:Number(arg));if(battle)combatControls()}
};
document.addEventListener('click',e=>{const b=e.target.closest('button[data-do]');if(!b||b.disabled)return;const f=acts[b.dataset.do];if(f){if(!['combat','sound'].includes(b.dataset.do))sounds('click');f(b.dataset.id||'')}});
document.addEventListener('change',e=>{if(e.target.id==='parentA')parentA=e.target.value;if(e.target.id==='parentB')parentB=e.target.value;if(e.target.id==='stage')campaignStage=Number(e.target.value)});
let stateArt={buildings:[],dragons:[]};
function sampleMap(){stateArt={buildings:s.buildings.map(b=>({...b,ready:stored(b)>=3})),dragons:s.dragons.slice(0,8),selected:placement?.id||null,grid:!!placement,hover:cursor}}
function tap(px,py){
 if(battle){battle.tap(px,py,W,H);if(battle)combatControls();return}
 sampleMap();const cell=Art.cell(px,py,W,H), hit=Art.hit(px,py,W,H,stateArt,moment);
 if(hit?.kind==='bubble')hit.item=B(hit.id);
 useCell(cell,hit);
}
world.addEventListener('click',e=>{const r=world.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)});
world.addEventListener('pointermove',e=>{if(!placement||e.pointerType==='touch')return;const r=world.getBoundingClientRect();cursor=Art.cell(e.clientX-r.left,e.clientY-r.top,W,H)});
world.addEventListener('keydown',e=>{
 if(battle)return;if(e.key==='Escape'){acts.cancelplace();return}
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;e.preventDefault();
 cursor??={x:4,y:4};if(e.key==='Enter'||e.key===' '){useCell(cursor,null);return}
 if(e.key==='ArrowLeft')cursor.x--;if(e.key==='ArrowRight')cursor.x++;if(e.key==='ArrowUp')cursor.y--;if(e.key==='ArrowDown')cursor.y++;
 cursor.x=Math.max(0,Math.min(9,cursor.x));cursor.y=Math.max(0,Math.min(9,cursor.y));
});
function resize(){
 const r=world.getBoundingClientRect();W=r.width;H=r.height;const dpr=Math.min(devicePixelRatio||1,2);
 world.width=Math.round(W*dpr);world.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paintMini();
}
function frame(ms){
 requestAnimationFrame(frame);
 if(document.hidden||!W||!H){lastFrame=ms;return}
 const sec=ms/1000,dt=lastFrame?Math.min(.1,(ms-lastFrame)/1000):0;lastFrame=ms;moment=reduced?0:sec;
 if(battle){if(!dlg.open)battle.tick(dt);if(battle)battle.draw(ctx,W,H,moment)}
 else if(!dlg.open||panel==='hatched'){
  sampleMap();Art.island(ctx,W,H,moment,stateArt);
  flying=flying.filter(f=>sec-f.born<1.4);
  for(const f of flying){const age=sec-f.born,p=Art.point(f.x,f.y,W,H);ctx.save();ctx.globalAlpha=Math.max(0,1-age*.67);ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#3d553f';ctx.fillStyle=f.color;ctx.strokeText(f.txt,p.x,p.y-22-age*35);ctx.fillText(f.txt,p.x,p.y-22-age*35);ctx.restore()}
 }
 if(dlg.open&&panel==='hatched'&&!reduced&&sec-hatchAt<2.2){
   const el=body.querySelector('.portrait canvas');if(el){paintMini(body);const c=el.getContext('2d'),w=el.clientWidth,h=el.clientHeight,a=sec-hatchAt;c.save();c.fillStyle='#d39335';for(let i=0;i<18;i++){const r=a*(25+(i%4)*10);c.globalAlpha=Math.max(0,1-a/2.2);c.fillText('✦',w/2+Math.cos(i*2.4)*r,h*.48+Math.sin(i*2.4)*r)}c.restore()}
 }
 if(sec-lastSecond>=.24){lastSecond=sec;
  if(panel==='breed'&&s.egg){const l=secLeft();if(!l&&$('#egg-status')?.textContent!=='Пора вылупляться!')show('breed','',true);else if(l&&$('#egg-timer'))$('#egg-timer').textContent='До вылупления: '+l+' с'}
 }
}
addEventListener('storage',e=>{if(e.key!==key)return;s=read();refreshIsland();if(dlg.open&&panel)show(panel,current,true)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&host)refreshStudy()});
// Establish the founding time on the first visit as well as after the first move.
try{if(!localStorage.getItem(key))save()}catch{}
new ResizeObserver(resize).observe(world);refreshIsland();resize();if(host)refreshStudy();requestAnimationFrame(frame);
})();

</script></body></html>
